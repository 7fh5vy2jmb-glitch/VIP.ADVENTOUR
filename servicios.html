<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Servicios | VIP Adventour</title>
<meta name="description" content="Tours disponibles, precios y reservas de VIP Adventour.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="imagenes/favicon.png">
<script src="app.js" defer></script>
</head>
<body data-page="servicios">
<header class="top"><div class="wrap"></div></header>
<main class="wrap">
<h1>Servicios</h1>
<p>Elige tu tour y reserva. Desde 5 personas el precio por persona baja.</p>
<div class="filtros"><div class="chips" id="chips" role="group" aria-label="Filtrar tours"><button class="chip" data-f="todos" aria-pressed="true">Todos</button><button class="chip" data-f="mar" aria-pressed="false">En el mar</button><button class="chip" data-f="tierra" aria-pressed="false">Todo terreno</button></div>
<label>Buscar un tour<input type="search" id="buscar" placeholder="Por ejemplo: snorkel"></label></div>
<div id="lista"></div>
</main>
<footer class="wrap foot">VIP Adventour. Tours y aventuras en la bahía.</footer>
</body>
</html>
