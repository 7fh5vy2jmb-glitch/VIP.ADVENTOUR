<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Administración | VIP Adventour</title>
<meta name="description" content="Acceso al panel de administración.">
<link rel="stylesheet" href="styles.css">
<link rel="icon" type="image/png" href="imagenes/favicon.png">
<script src="app.js" defer></script>
</head>
<body data-page="acceso">
<header class="top"><div class="wrap"></div></header>
<main class="wrap">
<h1>Panel de administración</h1>
<p>Ingresa la contraseña para editar los servicios.</p>
<form class="grid" id="loginForm">
<label>Contraseña<input type="password" id="clave" required autocomplete="current-password"></label>
<div><button class="btn" type="submit">Ingresar</button></div>
<p class="msg" id="mensaje" aria-live="polite"></p>
</form>
</main>
<footer class="wrap foot">VIP Adventour. Tours y aventuras en la bahía.</footer>
</body>
</html>
